<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 영화 보드</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>내 영화 보드</h1>

  <article class="card">

    <img
      class="poster"
      src="https://image.tmdb.org/t/p/w342/o1a5FULQTObsNbcgjapJtunpFzV.jpg"
      alt="영화 제목 포스터"
    >

    <span class="badge">6.9</span>

    <div class="info">
      <h2>타짜</h2>
      <p class="year">2006</p>
      <p class="overview">박판에 전부를 건 타짜들의 끝없는 욕망과 배신, 그리고 짜릿한 승부를 그린 범죄 스릴러 영화</p>
    </div>

  </article>

  <footer>
    <p>
      이 사이트는 TMDB API를 사용하지만 TMDB의 보증이나 인증을 받지 않았습니다.
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </p>

    <p>
      포스터와 영화 정보: TMDB (https://www.themoviedb.org)
    </p>
  </footer>

</body>
</html>
